<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home Maintenance Checklist Binder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0c0a09;
    --body: #4e4e4e;
    --muted: #777169;
    --muted-soft: #a8a29e;
    --hairline: #e7e5e4;
    --hairline-strong: #d6d3d1;
    --display: 'Fraunces', 'Times New Roman', serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--ink);
    background: #f5f5f5;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- Sheet ---- */
  .page {
    width: 8.5in;
    min-height: 11in;
    background: #fff;
    margin: 0.4in auto;
    padding: 0.6in 0.6in 0.6in 0.9in; /* extra left margin for 3-hole punch */
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.10);
    display: flex;
    flex-direction: column;
  }

  /* ---- Header ---- */
  .head { margin-bottom: 14px; }
  .room-title {
    font-family: var(--display);
    font-size: 36px;
    font-weight: 300;
    letter-spacing: -0.36px;
    line-height: 1.1;
  }
  .head-rule {
    height: 1px;
    margin-top: 14px;
    background: var(--ink);
  }

  /* ---- Checklist ---- */
  .checklist {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    column-gap: 42px;
    row-gap: 13px;
    align-content: start;
    margin-bottom: 14px;
  }
  .group { break-inside: avoid; }
  .group.span-2 { grid-column: 1 / -1; }

  .group-head {
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 1.1px;
    text-transform: uppercase;
    color: var(--ink);
    padding-bottom: 6px;
    margin-bottom: 9px;
    border-bottom: 1px solid var(--hairline);
  }

  .span-2 .items { columns: 2; column-gap: 42px; }
  .span-2 .item { break-inside: avoid; }

  .item {
    display: flex;
    align-items: flex-start;
    gap: 11px;
    font-size: 14px;
    letter-spacing: 0.14px;
    color: var(--body);
    padding: 5px 0;
  }
  .box {
    width: 15px;
    height: 15px;
    border: 1.2px solid var(--muted-soft);
    border-radius: 4px;
    flex: none;
    margin-top: 1px;
  }

  /* ---- Notes block ---- */
  .notes {
    border: 1px solid var(--hairline-strong);
    border-radius: 12px;
    padding: 14px 20px 15px;
    display: grid;
    grid-template-columns: 1fr 0.72fr;
    column-gap: 32px;
    row-gap: 4px;
  }
  .block-head {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    color: var(--ink);
    margin-bottom: 10px;
  }

  .ruled .line {
    height: 23px;
    border-bottom: 1px solid var(--hairline);
  }
  .ruled .line:first-child { border-top: 1px solid var(--hairline); }

  .supplies { margin-bottom: 16px; }
  .supply {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    margin-bottom: 11px;
    font-size: 14px;
    color: var(--muted);
  }
  .supply .dot { font-size: 15px; line-height: 1; color: var(--muted-soft); }
  .supply .fill { flex: 1; border-bottom: 1px solid var(--hairline-strong); height: 15px; }

  .walk .block-head { color: var(--muted); }
  .walk-item {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 12.5px;
    color: var(--muted);
    padding: 3px 0;
  }
  .walk-item .box { width: 12px; height: 12px; border-color: var(--hairline-strong); border-radius: 2.5px; margin-top: 0; }

  /* ---- Print ---- */
  @page { size: Letter; margin: 0.6in 0.6in 0.6in 0.9in; }
  @media print {
    body { background: #fff; }
    .page {
      width: auto;
      min-height: auto;
      margin: 0;
      padding: 0;
      box-shadow: none;
      page-break-after: always;
    }
    .page:last-child { page-break-after: auto; }
  }
</style>
</head>
<body>
<div id="binder"></div>

<script>

      { name: 'Floors', items: [
        'Sweep or vacuum floor', 'Mop hard flooring', 'Spot-clean under table and appliances' ] },
      { name: 'Organization', items: [
        'Clear and reset countertops', 'Load / unload dishwasher', 'Return items to pantry' ] },
      { name: 'Restocking', items: [
        'Refill dish soap and hand soap', 'Replace dish towels and sponge', 'Restock paper towels' ] },
      { name: 'Trash', items: [
        'Empty trash and recycling', 'Wipe bin lid', 'Take compost out' ] },

        'Wipe light switches and handles', 'Wipe down door and frame' ] },
      { name: 'Floors', items: [

      { name: 'Organization', items: [
        'Straighten counter items', 'Fold and hang fresh towels', 'Tidy under-sink storage' ] },
      { name: 'Restocking', items: [
        'Restock toilet paper', 'Refill hand soap', 'Replace hand towels' ] },
      { name: 'Trash', items: [

      { name: 'Final Inspection', items: [
        'Check for water spots', 'Confirm fresh towels hung', 'Fan and light off' ] }
    ]
  },
  {
    title: 'Upstairs Bathroom',
    groups: [
      { name: 'Surfaces', wide: true, items: [
        'Clean and disinfect toilet', 'Scrub shower and tub',
        'Clean glass door or curtain', 'Scrub sink and faucet',
        'Wipe counter and vanity', 'Clean mirror and glass',
        'Wipe tile and grout lines', 'Wipe handles and switches' ] },
      { name: 'Floors', items: [
        'Sweep floor', 'Mop and disinfect floor', 'Wash bath mats' ] },
      { name: 'Organization', items: [
        'Straighten counter and shelves', 'Fold and hang fresh towels', 'Tidy medicine cabinet' ] },
      { name: 'Restocking', items: [
        'Restock toilet paper', 'Refill hand and body soap', 'Replace towels' ] },
      { name: 'Trash', items: [
        'Empty wastebasket', 'Replace liner', 'Wipe bin exterior' ] },
      { name: 'Final Inspection', items: [
        'Check shower for soap scum', 'Confirm fresh towels hung', 'Fan and light off' ] }
    ]
  },
  {
    title: 'Primary Bedroom',
    groups: [
      { name: 'Surfaces', wide: true, items: [
        'Dust nightstands and dresser', 'Dust headboard and lamps',
        'Wipe mirrors and glass', 'Dust window sills and blinds',
        'Wipe light switches and handles', 'Dust ceiling fan and vents' ] },
      { name: 'Floors', items: [
        'Vacuum carpet or rug', 'Vacuum under bed', 'Mop hard flooring' ] },
      { name: 'Organization', items: [
        'Make the bed', 'Change bed linens', 'Put away clothes and clutter' ] },
      { name: 'Restocking', items: [
        'Fresh water glass', 'Replace tissues', 'Set out clean laundry' ] },
      { name: 'Trash', items: [
        'Empty wastebasket', 'Replace liner' ] },
      { name: 'Final Inspection', items: [
        'Surfaces clear and dust-free', 'Bed made neatly', 'Lights off' ] }
    ]
  },
  {
    title: 'Living Room',
    groups: [
      { name: 'Surfaces', wide: true, items: [
        'Dust coffee and side tables', 'Dust shelves and media console',
        'Wipe TV screen and electronics', 'Dust lamps and picture frames',
        'Wipe window sills and blinds', 'Dust ceiling fan and vents' ] },
      { name: 'Floors', items: [
        'Vacuum carpet and rugs', 'Vacuum under cushions', 'Mop hard flooring' ] },
      { name: 'Organization', items: [
        'Fluff and straighten cushions', 'Fold throw blankets', 'Return items to their place' ] },
      { name: 'Restocking', items: [
        'Replace candles as needed', 'Tidy remotes and chargers', 'Refresh coasters' ] },
      { name: 'Trash', items: [
        'Empty wastebasket', 'Clear recycling', 'Remove cups and dishes' ] },
      { name: 'Final Inspection', items: [
        'Surfaces clear and dust-free', 'Cushions reset', 'Lights off' ] }
    ]
  },
  {
    title: 'Laundry Room',
    groups: [
      { name: 'Surfaces', wide: true, items: [
        'Wipe washer and dryer exteriors', 'Wipe folding counter',
        'Clean utility sink and faucet', 'Wipe shelves and cabinet fronts',
        'Wipe light switches and handles', 'Clean dryer lint trap' ] },
      { name: 'Floors', items: [
        'Sweep floor', 'Mop floor', 'Clean behind machines' ] },
      { name: 'Organization', items: [
        'Sort and put away laundry', 'Tidy detergent shelf', 'Empty and reset hampers' ] },
      { name: 'Restocking', items: [
        'Refill detergent and softener', 'Restock dryer sheets', 'Restock stain remover' ] },
      { name: 'Trash', items: [
        'Empty lint and wastebasket', 'Replace liner' ] },
      { name: 'Final Inspection', items: [
        'Lint trap cleared', 'Counters clear', 'Machines off' ] }
    ]
  },
  {
    title: 'Home Office',
    groups: [
      { name: 'Surfaces', wide: true, items: [
        'Wipe desk and work surface', 'Dust monitor and electronics',
        'Wipe keyboard and mouse', 'Dust shelves and cabinets',
        'Wipe window sills and blinds', 'Dust lamps and picture frames' ] },
      { name: 'Floors', items: [
        'Vacuum carpet or rug', 'Vacuum under desk', 'Mop hard flooring' ] },
      { name: 'Organization', items: [
        'Clear and reset desktop', 'File loose papers', 'Tidy cables and chargers' ] },
      { name: 'Restocking', items: [
        'Restock paper and pens', 'Refill printer paper', 'Replace notepads' ] },
      { name: 'Trash', items: [
        'Empty wastebasket', 'Empty shredder / recycling' ] },
      { name: 'Final Inspection', items: [
        'Desk clear and dust-free', 'Cables tidy', 'Equipment powered down' ] }
    ]
  }
];

const WALK =['Nothing left on floor', 'Trash emptied', 'Supplies replenished', 'Room reset'];

function itemRow(text) {
  return '<div class="item"><span class="box"></span><span>' + text + '</span></div>';
}

function groupBlock(g) {
  const rows = g.items.map(itemRow).join('');
  return '<div class="group' + (g.wide ? ' span-2' : '') + '">' +
    '<div class="group-head">' + g.name + '</div>' +
    '<div class="items">' + rows + '</div></div>';
}

function notesBlock() {
  const lines = Array(4).fill('<div class="line"></div>').join('');
  const supplies = Array(3).fill('<div class="supply"><span class="dot">&bull;</span><span class="fill"></span></div>').join('');
  const walk = WALK.map(w => '<div class="walk-item"><span class="box"></span>' + w + '</div>').join('');
  return '<div class="notes">' +
    '<div class="ruled"><div class="block-head">Notes</div>' + lines + '</div>' +
    '<div>' +
      '<div class="supplies"><div class="block-head">Supplies Needed</div>' + supplies + '</div>' +
      '<div class="walk"><div class="block-head">Final Walkthrough</div>' + walk + '</div>' +
    '</div>' +
  '</div>';
}

function pageHTML(room) {
  const groups = room.groups.map(groupBlock).join('');
  return '<section class="page">' +
    '<div class="head">' +
      '<h1 class="room-title">' + room.title + '</h1>' +
      '<div class="head-rule"></div>' +
    '</div>' +
    '<div class="checklist">' + groups + '</div>' +
    notesBlock() +
  '</section>';
}

document.getElementById('binder').innerHTML = rooms.map(pageHTML).join('');
</script>
</body>
</html>
