<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home Maintenance Checklist Binder — Cal Tasks Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root {
    --ink: #1c1e21;
    --body: #4a4e54;
    --muted: #8a9099;
    --hairline: #e4e7ea;
    --hairline-strong: #d3d7db;
    --accent: #5b6b82;
    --accent-soft: #aab4c2;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--ink);
    background: #eceef0;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- Sheet ---- */
  .page {
    width: 8.5in;
    min-height: 11in;
    background: #fff;
    margin: 0.4in auto;
    padding: 0.6in 0.6in 0.6in 0.9in; /* extra left margin for 3-hole punch */
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.10);
    display: flex;
    flex-direction: column;
  }

  /* ---- Header ---- */
  .head { margin-bottom: 10px; }
  .room-title {
    font-size: 32px;
    font-weight: 600;
    letter-spacing: -0.8px;
    line-height: 1.05;
    text-transform: uppercase;
  }
  .head-rule {
    height: 2px;
    margin-top: 12px;
    background: linear-gradient(to right, var(--accent) 0%, var(--accent) 42%, var(--hairline-strong) 42%, var(--hairline-strong) 100%);
  }

  /* ---- Checklist ---- */
  .checklist {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    column-gap: 42px;
    row-gap: 9px;
    align-content: start;
    margin-bottom: 10px;
  }
  .group { break-inside: avoid; }
  .group.span-2 { grid-column: 1 / -1; }

  .group-head {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 13.5px;
    font-weight: 700;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: var(--accent);
    padding-bottom: 5px;
    margin-bottom: 7px;
    border-bottom: 1px solid var(--hairline);
  }
  .group-head i { font-size: 14px; flex: none; color: var(--accent); }

  .span-2 .items { columns: 2; column-gap: 42px; }
  .span-2 .item { break-inside: avoid; }

  .item {
    display: flex;
    align-items: flex-start;
    gap: 11px;
    font-size: 14px;
    color: var(--body);
    padding: 3px 0;
  }
  .box {
    width: 15px;
    height: 15px;
    border: 1.2px solid var(--accent-soft);
    border-radius: 3px;
    flex: none;
    margin-top: 1px;
  }

  /* ---- Cal Tasks subsection ---- */
  .cal {
    grid-column: 1 / -1;
    margin-top: 4px;
    border: 1px solid var(--hairline-strong);
    border-radius: 10px;
    background: #f6f8fb;
    padding: 9px 16px 4px;
    break-inside: avoid;
  }
  .cal-head {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 13.5px;
    font-weight: 700;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 8px;
  }
  .cal-head i { font-size: 14px; color: var(--accent); }
  .cal .items { columns: 2; column-gap: 42px; }
  .cal .item { break-inside: avoid; color: var(--ink); }
  .cal .box { border-color: var(--accent); }

  /* ---- Notes block ---- */
  .notes {
    border: 1px solid var(--hairline-strong);
    border-radius: 10px;
    padding: 11px 18px 11px;
    display: grid;
    grid-template-columns: 1fr 0.72fr;
    column-gap: 32px;
    row-gap: 4px;
  }
  .block-head {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    color: var(--ink);
    margin-bottom: 10px;
  }
  .block-head i { font-size: 13px; color: var(--accent); }

  .ruled .line {
    height: 23px;
    border-bottom: 1px solid var(--hairline);
  }
  .ruled .line:first-child { border-top: 1px solid var(--hairline); }

  .supplies { margin-bottom: 12px; }
  .supply {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    margin-bottom: 8px;
    font-size: 14px;
    color: var(--muted);
  }
  .supply .dot { font-size: 15px; line-height: 1; color: var(--accent-soft); }
  .supply .fill { flex: 1; border-bottom: 1px solid var(--hairline-strong); height: 15px; }

  .walk .block-head { color: var(--muted); }
  .walk-item {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 12.5px;
    color: var(--muted);
    padding: 2px 0;
  }
  .walk-item .box { width: 12px; height: 12px; border-color: var(--hairline-strong); border-radius: 2.5px; margin-top: 0; }

  /* ---- Print ---- */
  @page { size: Letter; margin: 0.6in 0.6in 0.6in 0.9in; }
  @media print {
    body { background: #fff; }
    .page {
      width: auto;
      min-height: auto;
      margin: 0;
      padding: 0;
      box-shadow: none;
      page-break-after: always;
    }
    .page:last-child { page-break-after: auto; }
  }
</style>
</head>
<body>
<div id="binder"></div>

<script>

        'Clean and disinfect toilet', 'Scrub sink and faucet',

        'Wipe light switches and handles', 'Wipe down door and frame' ] },
      { name: 'Floors', icon: 'floors', items: [
        'Sweep floor', 'Mop and disinfect floor', 'Shake out or wash bath mat' ] },
      { name: 'Organization', icon: 'organization', items: [
        'Straighten counter items', 'Fold and hang fresh towels', 'Tidy under-sink storage' ] },
      { name: 'Restocking', icon: 'restocking', items: [
        'Restock toilet paper', 'Refill hand soap', 'Replace hand towels' ] },
      { name: 'Trash', icon: 'trash', items: [
        'Empty wastebasket', 'Replace liner', 'Wipe bin exterior' ] },
      { name: 'Final Inspection', icon: 'inspection', items: [
        'Check for water spots', 'Confirm fresh towels hung', 'Fan and light off' ] }
    ],
    cal: [ 'Put out a fresh hand towel', 'Wipe the sink', 'Refill the toilet paper', 'Empty the small trash' ]
  },
  {
    title: 'Upstairs Bathroom',
    groups: [
      { name: 'Surfaces', icon: 'surfaces', wide: true, items: [
        'Clean and disinfect toilet', 'Scrub shower and tub',
        'Clean glass door or curtain', 'Scrub sink and faucet',
        'Wipe counter and vanity', 'Clean mirror and glass',
        'Wipe tile and grout lines', 'Wipe handles and switches' ] },
      { name: 'Floors', icon: 'floors', items: [
        'Sweep floor', 'Mop and disinfect floor', 'Wash bath mats' ] },
      { name: 'Organization', icon: 'organization', items: [
        'Straighten counter and shelves', 'Fold and hang fresh towels', 'Tidy medicine cabinet' ] },
      { name: 'Restocking', icon: 'restocking', items: [
        'Restock toilet paper', 'Refill hand and body soap', 'Replace towels' ] },

        'Empty wastebasket', 'Replace liner', 'Wipe bin exterior' ] },

    ],

  },
  {
    title: 'Primary Bedroom',
    groups: [
      { name: 'Surfaces', icon: 'surfaces', wide: true, items: [
        'Dust nightstands and dresser', 'Dust headboard and lamps',
        'Wipe mirrors and glass', 'Dust window sills and blinds',
        'Wipe light switches and handles', 'Dust ceiling fan and vents' ] },
      { name: 'Floors', icon: 'floors', items: [
        'Vacuum carpet or rug', 'Vacuum under bed', 'Mop hard flooring' ] },
      { name: 'Organization', icon: 'organization', items: [
        'Make the bed', 'Change bed linens', 'Put away clothes and clutter' ] },
      { name: 'Restocking', icon: 'restocking', items: [
        'Fresh water glass', 'Replace tissues', 'Set out clean laundry' ] },
      { name: 'Trash', icon: 'trash', items: [
        'Empty wastebasket', 'Replace liner' ] },
      { name: 'Final Inspection', icon: 'inspection', items: [
        'Surfaces clear and dust-free', 'Bed made neatly', 'Lights off' ] }
    ],
    cal: [ 'Make the bed', 'Put clothes in the hamper', 'Fluff the pillows', 'Open the blinds' ]
  },
  {
    title: 'Living Room',
    groups: [
      { name: 'Surfaces', icon: 'surfaces', wide: true, items: [
        'Dust coffee and side tables', 'Dust shelves and media console',
        'Wipe TV screen and electronics', 'Dust lamps and picture frames',
        'Wipe window sills and blinds', 'Dust ceiling fan and vents' ] },
      { name: 'Floors', icon: 'floors', items: [
        'Vacuum carpet and rugs', 'Vacuum under cushions', 'Mop hard flooring' ] },
      { name: 'Organization', icon: 'organization', items: [
        'Fluff and straighten cushions', 'Fold throw blankets', 'Return items to their place' ] },
      { name: 'Restocking', icon: 'restocking', items: [
        'Replace candles as needed', 'Tidy remotes and chargers', 'Refresh coasters' ] },
      { name: 'Trash', icon: 'trash', items: [
        'Empty wastebasket', 'Clear recycling', 'Remove cups and dishes' ] },
      { name: 'Final Inspection', icon: 'inspection', items: [
        'Surfaces clear and dust-free', 'Cushions reset', 'Lights off' ] }
    ],
    cal: [ 'Put toys and books away', 'Fluff the couch pillows', 'Fold the throw blankets', 'Collect cups and dishes' ]
  },
  {

    groups: [
      { name: 'Surfaces', icon: 'surfaces', wide: true, items: [

        'Wipe light switches and handles', 'Clean dryer lint trap' ] },
      { name: 'Floors', icon: 'floors', items: [

      { name: 'Organization', icon: 'organization', items: [

    ],

  },
  {

    groups: [
      { name: 'Surfaces', icon: 'surfaces', wide: true, items: [
        'Wipe desk and work surface', 'Dust monitor and electronics',
        'Wipe keyboard and mouse', 'Dust shelves and cabinets',
        'Wipe window sills and blinds', 'Dust lamps and picture frames' ] },
      { name: 'Floors', icon: 'floors', items: [
        'Vacuum carpet or rug', 'Vacuum under desk', 'Mop hard flooring' ] },
      { name: 'Organization', icon: 'organization', items: [
        'Clear and reset desktop', 'File loose papers', 'Tidy cables and chargers' ] },
      { name: 'Restocking', icon: 'restocking', items: [
        'Restock paper and pens', 'Refill printer paper', 'Replace notepads' ] },
      { name: 'Trash', icon: 'trash', items: [
        'Empty wastebasket', 'Empty shredder / recycling' ] },
      { name: 'Final Inspection', icon: 'inspection', items: [
        'Desk clear and dust-free', 'Cables tidy', 'Equipment powered down' ] }
    ],
    cal: [ 'Push in the chair', 'Toss the scrap paper', 'Line up the pens', 'Straighten the desk' ]
  }
];

const WALK = ['Nothing left on floor', 'Trash emptied', 'Supplies replenished', 'Room reset'];

function itemRow(text) {
  return '<div class="item"><span class="box"></span><span>' + text + '</span></div>';
}

function groupBlock(g) {
  const rows = g.items.map(itemRow).join('');
  return '<div class="group' + (g.wide ? ' span-2' : '') + '">' +
    '<div class="group-head">' + ICON[g.icon] + g.name + '</div>' +
    '<div class="items">' + rows + '</div></div>';
}

function calBlock(room) {
  const rows = room.cal.map(itemRow).join('');
  return '<div class="cal">' +
    '<div class="cal-head">' + ICON.cal + 'Cal Tasks</div>' +
    '<div class="items">' + rows + '</div></div>';
}

function notesBlock() {
  const lines = Array(4).fill('<div class="line"></div>').join('');
  const supplies = Array(3).fill('<div class="supply"><span class="dot">&bull;</span><span class="fill"></span></div>').join('');
  const walk = WALK.map(w => '<div class="walk-item"><span class="box"></span>' + w + '</div>').join('');
  return '<div class="notes">' +
    '<div class="ruled"><div class="block-head">' + ICON.notes + 'Notes</div>' + lines + '</div>' +
    '<div>' +
      '<div class="supplies"><div class="block-head">' + ICON.supplies + 'Supplies Needed</div>' + supplies + '</div>' +
      '<div class="walk"><div class="block-head">' + ICON.walk + 'Final Walkthrough</div>' + walk + '</div>' +
    '</div>' +
  '</div>';
}

function pageHTML(room) {
  const groups = room.groups.map(groupBlock).join('');
  return '<section class="page">' +
    '<div class="head">' +
      '<h1 class="room-title">' + room.title + '</h1>' +
      '<div class="head-rule"></div>' +
    '</div>' +
    '<div class="checklist">' + groups + calBlock(room) + '</div>' +
    notesBlock() +
  '</section>';
}

document.getElementById('binder').innerHTML = rooms.map(pageHTML).join('');
</script>
</body>
</html>
